  --hl-g:rgba(52,210,100,.33); --hl-r:rgba(255,84,138,.33); --hl-b:rgba(80,160,255,.33); --hl-y:rgba(255,210,0,.33);
  --c-avoid:#199e70; --c-cert:#3987e5; --c-emit:#d95926;
  --grid:#2c2c2a; --axis:#4a4a46;
  --good:#0ca30c; --good-ink:#3FCB5B; --warn:#fab219; --bad:#ef6a6a;
  --pillar-oek:#1D3440; --pillar-eco:#1C3324; --pillar-soz:#382E22;
  --sheet-shadow: 0 10px 30px -12px rgba(0,0,0,.6);
  --pop-shadow: 0 18px 50px -12px rgba(0,0,0,.7);
}

/* ============ Stage ============ */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);overflow:hidden}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
#stage{width:1600px;height:900px;position:relative;background:var(--paper);color:var(--ink);
  font-size:26px;line-height:1.4;transform-origin:center center;overflow:hidden;flex:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:6px}

/* ============ Chrome ============ */
#topbar{position:absolute;left:0;right:0;top:0;height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;border-bottom:1px solid var(--rule)}
#phases{display:flex;gap:4px;align-items:center;font-size:17px;color:var(--ink-3)}
#phases button{padding:6px 10px;border-radius:8px;position:relative;white-space:nowrap;background:transparent;border:0;cursor:pointer;color:inherit;font:inherit}
#phases button:hover{background:var(--panel-2);color:var(--ink)}
#phases button.cur{color:var(--ink);font-weight:600}
#phases button.cur::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px;background:var(--teal)}
#phases button.past{color:var(--ink-2)}
#tools{display:flex;gap:6px;align-items:center}
#tools .tlabel{font-size:15px;color:var(--ink-3);margin-right:6px}
.toolbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--rule);background:transparent;display:grid;place-items:center;
  color:var(--ink-3);cursor:pointer;position:relative;padding:0;transition:background .2s,color .2s,border-color .2s}
.toolbtn svg{width:20px;height:20px}
.toolbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.toolbtn .n{position:absolute;right:-5px;top:-5px;font-size:11px;font-weight:700;background:var(--paper);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:9px;min-width:17px;height:17px;line-height:15px;text-align:center}
.toolbtn.on .n{color:var(--teal-ink);border-color:var(--teal)}
#bottombar{position:absolute;left:0;right:0;bottom:0;height:48px;display:flex;align-items:center;justify-content:space-between;
  padding:0 40px;font-size:16px;color:var(--ink-3);border-top:1px solid var(--rule-2)}
#toolname{display:flex;gap:8px;align-items:center;min-width:0;white-space:nowrap;overflow:hidden}
#toolname b{color:var(--ink-2);font-weight:600}
.navbtns{display:flex;gap:6px;align-items:center}
.navbtns button{background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--ink-3);font-size:16px}
.navbtns button:hover{border-color:var(--rule);color:var(--ink)}
.navbtns .arrow{font-size:20px;line-height:1;padding:4px 12px}
#counter{font-variant-numeric:tabular-nums;color:var(--ink-2);min-width:64px;text-align:center}
#stepdots{display:flex;gap:5px;margin-right:10px}
#stepdots i{width:7px;height:7px;border-radius:50%;background:var(--rule)}
#stepdots i.on{background:var(--teal)}
#minitimer{font-variant-numeric:tabular-nums;color:var(--teal-ink);font-weight:600;margin-right:8px;display:none}
#minitimer.show{display:inline}

/* ============ Slides ============ */
#deck{position:absolute;left:0;right:0;top:64px;bottom:48px}
.slide{position:absolute;inset:0;padding:30px 56px 22px;display:none}
.slide.active{display:block;animation:slidein .28s ease both}
@keyframes slidein{from{opacity:0}to{opacity:1}}
.slide [data-step]{transition:opacity .35s ease, visibility 0s linear .35s}
.slide [data-step]:not(.vis){opacity:0;visibility:hidden}
.slide [data-step].vis{opacity:1;visibility:visible;transition:opacity .35s ease, visibility 0s}
.slide [data-only]:not(.vis){display:none !important}

h1{font-size:44px;line-height:1.12;margin:0 0 6px;font-weight:700;letter-spacing:-.01em}
h1 .sub{display:block;font-size:24px;font-weight:400;color:var(--ink-2);letter-spacing:0;margin-top:6px}
h2{font-size:30px;line-height:1.2;margin:0 0 8px;font-weight:600}
h3{font-size:24px;line-height:1.25;margin:0 0 6px;font-weight:600}
p{margin:0 0 12px}
.small{font-size:19px;line-height:1.4}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.row{display:flex;gap:24px}
.col{display:flex;flex-direction:column;gap:16px}

.btn{font-size:18px;font-weight:600;padding:9px 16px;border:1.5px solid var(--rule);border-radius:10px;background:var(--panel);
  cursor:pointer;color:var(--ink);line-height:1.2}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.small{font-size:16px;padding:6px 12px}

.mtag{display:inline-flex;align-items:center;background:var(--tag);color:var(--tag-ink);font-weight:600;font-size:24px;padding:4px 14px;letter-spacing:.02em}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:20px 24px}
.ask{font-size:27px;line-height:1.35;font-weight:500}
.ask::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--teal);margin-right:12px;vertical-align:middle;position:relative;top:-2px}
.answer{background:var(--teal-soft);border-left:5px solid var(--teal);border-radius:0 12px 12px 0;padding:14px 20px;font-size:24px;line-height:1.4}
.answer .lbl,.tip .lbl,.op .lbl{display:block;font-size:16px;font-weight:700;color:var(--teal-ink);margin-bottom:4px}
.tip{background:var(--tip);border-left:5px solid var(--sig);border-radius:0 12px 12px 0;padding:14px 20px;font-size:22px;line-height:1.4}
.tip .lbl{color:var(--sig)}
.tip .lbl svg{width:16px;height:16px;vertical-align:-2px;margin-right:6px}
.op{border:1.5px solid var(--teal);border-radius:12px;padding:12px 18px;font-size:21px;line-height:1.35;background:var(--panel)}
.op b{color:var(--teal-ink)}
.afb{display:inline-block;font-size:14px;font-weight:700;border:1.5px solid currentColor;border-radius:6px;padding:0 6px;margin-left:8px;vertical-align:2px;color:var(--ink-3)}
.task{display:flex;gap:14px;align-items:flex-start;font-size:23px;line-height:1.35;color:var(--teal-ink)}
.task .num{flex:none;background:#BFE0EE;color:#0E4F6B;font-weight:700;font-size:20px;min-width:44px;text-align:center;padding:2px 8px;margin-top:2px}
:root[data-theme="dark"] .task .num{background:#1D3440;color:#9ED2EA}
.builders{display:flex;flex-direction:column;gap:6px;font-size:21px;font-family:var(--serif);font-style:italic;color:var(--ink-2)}
.builders span::before{content:"„";color:var(--ink-3)}
.builders span::after{content:" …“";color:var(--ink-3)}
.src{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--ink-3);line-height:1.4}
.src-hl{transition:background .4s;border-radius:4px;padding:0 4px;margin:0 -4px}
.slide.s2 .src-hl{background:var(--hl-y)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);border-radius:999px;padding:4px 14px;font-size:19px;background:var(--panel)}
.optbadge{font-size:14px;font-weight:700;color:var(--ink-3);border:1px dashed var(--ink-3);border-radius:6px;padding:1px 7px;margin-left:10px;vertical-align:6px}
/* ============ Book text ============ */
.book{background:var(--panel);border:1px solid var(--rule);border-radius:4px;box-shadow:var(--sheet-shadow);padding:20px 28px 20px 14px;position:relative;overflow:hidden;min-height:0}
.book-head{display:flex;align-items:center;gap:16px;margin:0 0 14px 44px}
.book-head h3{font-weight:400;font-size:30px;margin:0}
.lines{font-family:var(--serif);font-size:26px;line-height:1.62;overflow:hidden}
.ln{display:grid;grid-template-columns:44px 1fr;white-space:nowrap}
.ln .no{font-family:var(--sans);font-size:15px;color:var(--ink-3);opacity:.32;text-align:right;padding-right:14px;align-self:center}
.ln.five .no{opacity:1}
.prose{font-family:var(--serif);font-size:26px;line-height:1.62}
mark.hl{background-color:transparent;color:inherit;border-radius:.18em;padding:0 .06em;margin:0 -.06em;
  background-image:linear-gradient(var(--hlc),var(--hlc));background-repeat:no-repeat;background-size:0% 80%;background-position:0 55%;
  transition:background-size .5s ease var(--d,0s);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hl-g{--hlc:var(--hl-g)} .hl-r{--hlc:var(--hl-r)} .hl-b{--hlc:var(--hl-b)} .hl-y{--hlc:var(--hl-y)}
.slide.s1 .tm mark.hl{background-size:100% 80%}
.sig{text-decoration-line:underline;text-decoration-style:wavy;text-decoration-color:transparent;text-decoration-thickness:2px;text-underline-offset:7px;transition:text-decoration-color .4s ease .3s}
.slide.s1 .tm .sig{text-decoration-color:var(--sig)}
.lq{border-radius:4px;transition:box-shadow .4s ease .3s;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.slide.s1 .tm .lq{box-shadow:0 0 0 2.5px var(--teal)}
.term{border-bottom:2.5px dotted var(--teal);cursor:help;border-radius:2px}
.term:hover{background:var(--teal-soft)}
.w{border-radius:.18em;transition:background-color .15s}
.w.pm-g{background-color:var(--hl-g)} .w.pm-r{background-color:var(--hl-r)} .w.pm-b{background-color:var(--hl-b)} .w.pm-y{background-color:var(--hl-y)}
#stage[class*="pen-"] .lines,#stage[class*="pen-"] .prose{cursor:crosshair;user-select:none;-webkit-user-select:none}
#stage[class*="pen-"] .term{cursor:crosshair}
.pens{position:absolute;top:14px;right:16px;display:flex;gap:6px;align-items:center}
.pen{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0;display:grid;place-items:center;background:var(--panel)}
.pen[data-pen="g"]{background:linear-gradient(var(--hl-g),var(--hl-g)),var(--panel)}
.pen[data-pen="r"]{background:linear-gradient(var(--hl-r),var(--hl-r)),var(--panel)}
.pen[data-pen="b"]{background:linear-gradient(var(--hl-b),var(--hl-b)),var(--panel)}
.pen[data-pen="y"]{background:linear-gradient(var(--hl-y),var(--hl-y)),var(--panel)}
.pen svg{width:16px;height:16px;color:var(--ink-2)}
.pen.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.pen.clear{width:auto;border-radius:8px;font-size:13px;font-weight:600;padding:0 8px;color:var(--ink-3)}
.penlegend{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pchip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--rule);border-radius:999px;padding:4px 12px 4px 6px;font-size:17px;line-height:1.2;background:var(--panel);color:var(--ink)}
.pen.pchip{width:auto;height:auto;border-radius:999px;background:var(--panel);cursor:pointer;padding:4px 12px 4px 6px;display:inline-flex}
.pen.pchip .sw{width:26px;height:16px}
.pchip.static{border-style:dashed;color:var(--ink-2)}
.pchip.static .sw{width:30px}
.penlegend .pen{width:32px;height:32px}
.penlegend .pen.clear{width:auto;height:32px}
.penlegend .pen.pchip{width:auto;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:19px;line-height:1.3}
.legend .it{display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:34px;height:18px;border-radius:4px}
.sw.g{background:var(--hl-g)} .sw.r{background:var(--hl-r)} .sw.b{background:var(--hl-b)} .sw.y{background:var(--hl-y)}
.sw.s{height:auto;width:34px;font-size:20px;line-height:1;text-decoration:underline wavy var(--sig) 2px;text-underline-offset:5px;color:transparent}
.sw.q{border-radius:4px;box-shadow:inset 0 0 0 2.5px var(--teal);background:transparent}

/* Section slide */
.sec-grid{display:grid;grid-template-columns:770px 1fr;gap:40px;height:100%}
.sec-side{display:flex;flex-direction:column;gap:14px;min-height:0}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px}
.sec-head h2{margin:0}
.outline{margin-top:auto;border-top:1px solid var(--rule);padding-top:8px}
.outline .ttl{font-size:16px;font-weight:700;color:var(--ink-3);margin-bottom:6px}
.outline ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.outline li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:17px;line-height:1.25;color:var(--ink-2);padding:2px 8px;border-radius:6px}
.outline li .z{color:var(--ink-3);font-variant-numeric:tabular-nums}
.outline li.cur{background:var(--teal-soft);color:var(--ink);font-weight:600}
.outline li.todo .h{border-bottom:1.5px dashed var(--rule);height:1em;align-self:center}
.heading-reveal{font-size:28px;line-height:1.22;font-weight:600}
.sec-grid .book-head h3{font-size:25px;line-height:1.2}
/* ============ Title ============ */
.title-grid{display:grid;grid-template-columns:1fr 470px;gap:40px;align-items:center;height:100%;padding:0 10px}
.title-grid .big{font-size:132px;line-height:.95;font-weight:800;letter-spacing:-.035em;margin:0}
.title-grid .q{font-size:42px;line-height:1.15;font-weight:400;color:var(--ink-2);margin:14px 0 34px}
.goals{display:flex;flex-direction:column;gap:12px;font-size:24px;max-width:840px}
.goals div{display:grid;grid-template-columns:34px 1fr;gap:6px}
.goals div::before{content:"";width:16px;height:16px;border:2.5px solid var(--teal);border-radius:50%;margin-top:7px}
.meta{font-size:19px;color:var(--ink-3);margin-top:34px;line-height:1.5}
/* ============ Misc components ============ */
.tools-grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:26px;margin-top:20px}
.phase-col h3{font-size:20px;color:var(--ink-3);font-weight:700;border-bottom:3px solid var(--teal);padding-bottom:6px;margin-bottom:14px}
.phase-col .inner{display:grid;gap:14px}
.phase-col.mid .inner{grid-template-columns:1fr 1fr}
.tcard{border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:44px 1fr;gap:4px 12px;align-items:start}
.tcard .ic{grid-row:span 2;width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;position:relative}
.tcard .ic svg{width:22px;height:22px}
.tcard .ic .n{position:absolute;right:-6px;top:-6px;background:var(--panel);color:var(--teal-ink);border:1.5px solid var(--teal);font-size:12px;font-weight:700;border-radius:9px;min-width:18px;height:18px;line-height:15px;text-align:center}
.tcard b{font-size:22px;line-height:1.2}
.tcard span{font-size:17px;line-height:1.3;color:var(--ink-2)}
.merksatz{margin-top:22px;font-size:28px;font-weight:500;text-align:center;padding:16px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

.big-number{font-size:84px;font-weight:800;letter-spacing:-.02em;line-height:1}
.unit{font-size:28px;font-weight:600;color:var(--ink-2)}
.people{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 4px}
.people svg{width:24px;height:30px;color:var(--teal)}
.check-list{display:flex;flex-direction:column;gap:12px}
.check-list .qa{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:baseline;font-size:21px;line-height:1.32;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.check-list .qa b{font-size:20px;color:var(--teal-ink)}

table.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:20px;line-height:1.3}
table.cmp th{text-align:left;font-size:19px;padding:10px 14px;border-bottom:2px solid var(--ink);vertical-align:bottom}
table.cmp td{padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
table.cmp td.k{font-weight:600;width:260px}
table.cmp td.cell{cursor:pointer;position:relative}
table.cmp td.cell .c{transition:opacity .3s}
table.cmp td.cell:not(.open) .c{opacity:0}
table.cmp td.cell:not(.open)::after{content:"aufdecken";position:absolute;left:14px;top:10px;font-size:15px;color:var(--ink-3);border:1px dashed var(--rule);border-radius:6px;padding:1px 8px}
table.cmp td.cell:hover{background:var(--panel-2)}

.scale-wrap{position:relative;height:300px}
.beam{position:absolute;left:50%;top:70px;width:760px;margin-left:-380px;height:10px;background:var(--ink);border-radius:5px;transform-origin:50% 50%;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.post{position:absolute;left:50%;top:75px;width:12px;margin-left:-6px;height:205px;background:var(--ink-2);border-radius:4px}
.postbase{position:absolute;left:50%;bottom:4px;width:200px;margin-left:-100px;height:14px;background:var(--ink-2);border-radius:7px}
.pan{position:absolute;top:5px;width:330px;transform-origin:50% 0}
.pan.l{left:-10px} .pan.r{right:-10px}
.pan .str{height:28px;border-left:2px solid var(--ink-3);border-right:2px solid var(--ink-3);margin:0 40px}
.pan .dish{background:var(--panel);border:2px solid var(--ink);border-radius:0 0 18px 18px;min-height:64px;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.pan .dish h3{font-size:18px;margin:0;text-align:center}
.pan .dish .ac{font-size:14px;line-height:1.25;background:var(--panel-2);border-radius:6px;padding:3px 8px;cursor:pointer}
.argpool{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.arg{display:grid;grid-template-columns:1fr;gap:6px;align-items:start;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:17px;line-height:1.3}
.arg .bt{display:flex;gap:6px}
.arg .bt button{font-size:14px;font-weight:700;border:1.5px solid var(--rule);background:var(--paper);border-radius:7px;padding:3px 8px;cursor:pointer}
.arg .bt button:hover{border-color:var(--teal)}
.arg.used{display:none}

table.check{border-collapse:separate;border-spacing:0;width:100%;font-size:20px}
table.check th{text-align:left;padding:8px 12px;border-bottom:2px solid var(--ink);font-size:19px}
table.check td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.check td.v{width:200px;cursor:pointer;text-align:left}
table.check td.v:hover{background:var(--panel-2)}
.vs{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:18px;color:var(--ink-3)}
.vs i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--rule);font-weight:800;color:#fff}
.vs.ja i{background:var(--good);border:0} .vs.nein i{background:var(--bad);border:0} .vs.teils i{background:#D99A00;border:0}
.vs.ja,.vs.nein,.vs.teils{color:var(--ink)}
.timeline{display:flex;flex-direction:column;gap:12px}
.tl{display:grid;grid-template-columns:92px 1fr;gap:14px;font-size:20px;line-height:1.35}
.tl .y{font-weight:800;font-size:22px;color:var(--teal-ink)}
.crit-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.crit-cards .card{padding:14px 16px}
.crit-cards b{display:block;font-size:22px;margin-bottom:4px}
.crit-cards span{font-size:18px;color:var(--ink-2);line-height:1.3;display:block}
.votes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vote{border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-align:left}
.vote .ic{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.vote .ic svg{width:20px;height:20px}
.vote b{font-size:18px;line-height:1.2}
.vote .ct{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.vote .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.vote .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .4s}
textarea.hyp{width:100%;font:inherit;font-size:24px;line-height:1.35;border:1.5px dashed var(--rule);border-radius:12px;padding:12px 16px;background:var(--panel);color:var(--ink);resize:none}
textarea.hyp:focus{outline:none;border-color:var(--teal);border-style:solid}
/* ============ Overlays ============ */
#popover{position:absolute;z-index:40;width:470px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--pop-shadow);
  padding:16px 20px 18px;font-size:20px;line-height:1.4;display:none}
#popover.show{display:block}
#popover h4{margin:0 0 6px;font-size:22px}
#popover .from{font-size:15px;color:var(--ink-3);margin-top:8px}
#toolcard{position:absolute;z-index:40;right:40px;top:72px;width:470px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--pop-shadow);padding:18px 22px;display:none;font-size:20px}
#toolcard.show{display:block}
#toolcard .ph{font-size:15px;color:var(--ink-3);font-weight:700}
#toolcard h4{margin:2px 0 8px;font-size:24px}
#overview{position:absolute;inset:0;z-index:50;background:var(--paper);display:none;padding:28px 40px;overflow:auto}
#overview.show{display:block}
#overview .ovh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#overview .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ovcard{border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;min-height:96px;display:flex;flex-direction:column;gap:4px}
.ovcard:hover{border-color:var(--teal)}
.ovcard.cur{border:2px solid var(--teal)}
.ovcard .nr{font-size:14px;color:var(--ink-3);font-weight:700}
.ovcard b{font-size:18px;line-height:1.25}
.ovcard .ph{font-size:14px;color:var(--teal-ink);margin-top:auto}
.ovcard.opt{border-style:dashed}
.ovcard.skipped{opacity:.4}
.toggle{display:inline-flex;align-items:center;gap:10px;font-size:18px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--teal)}
#timer{position:absolute;z-index:45;left:40px;bottom:58px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--pop-shadow);padding:14px 18px;display:none;width:300px}
#timer.show{display:block}
#timer .tdisp{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1}
#timer.done .tdisp{color:var(--crit);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
#timer .trow{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
#blackout{position:absolute;inset:0;background:#000;z-index:60;display:none}
#blackout.show{display:block}
#help{position:absolute;inset:0;z-index:55;background:rgba(10,20,25,.55);display:none;place-items:center}
#help.show{display:grid}
#help .card{width:760px;font-size:21px}
#help table{width:100%;border-collapse:collapse}
#help td{padding:6px 8px;border-bottom:1px solid var(--rule-2)}
#help kbd{font-family:var(--sans);font-weight:700;font-size:17px;border:1.5px solid var(--rule);border-bottom-width:3px;border-radius:6px;padding:0 8px;background:var(--paper)}
/* ============ Beurteilen ============ */
.builders span.full::after{content:"“"}
.stairs{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:end;height:560px}
.stair{border-radius:14px 14px 0 0;padding:16px 20px;display:flex;flex-direction:column;gap:10px;border:1px solid var(--rule);border-bottom:4px solid var(--ink)}
.stair.l1{height:300px;background:var(--panel-2)}
.stair.l2{height:420px;background:var(--teal-soft)}
.stair.l3{height:540px;background:#135C7C;color:#fff;border-color:#135C7C;border-bottom-color:var(--ink)}
.stair .afb-l{font-size:16px;font-weight:700;color:var(--ink-3)}
.stair.l3 .afb-l{color:rgba(255,255,255,.8)}
.stair h3{font-size:28px;margin:0}
.stair .sq{font-size:21px;font-style:italic;margin:0;line-height:1.3}
.stair .ops{font-size:18px;margin:0;opacity:.85;line-height:1.3}
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tchip{display:inline-flex;align-items:center;gap:8px;background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:4px 10px 4px 4px;font-size:17px}
.tchip b{background:#BFE0EE;color:#0E4F6B;padding:0 7px;border-radius:5px}
.tchip.now{box-shadow:0 0 0 3px #FAB219}
.taskbig{display:flex;gap:16px;align-items:flex-start;margin-top:12px}
.taskbig .num{flex:none;background:#BFE0EE;color:#0E4F6B;font-weight:700;font-size:30px;min-width:56px;text-align:center;padding:2px 10px;margin-top:4px}
.taskbig p{font-size:40px;line-height:1.3;color:var(--teal-ink);margin:0}
.tp{border-bottom:5px solid transparent;transition:border-color .35s;padding-bottom:2px}
.slide.s1 .tp1{border-color:var(--teal)} .slide.s2 .tp2{border-color:#E0A800} .slide.s3 .tp3{border-color:var(--crit)}
.tp-notes{display:grid;grid-template-columns:1fr 1.3fr 1.2fr;gap:18px;margin-top:18px}
.tpn{border-top:5px solid;padding-top:8px;font-size:20px;line-height:1.35}
.tpn b{display:block;font-size:18px;margin-bottom:2px}
.tpn.n1{border-color:var(--teal)} .tpn.n2{border-color:#E0A800} .tpn.n3{border-color:var(--crit)}
.verdict{flex:1;border-radius:14px;padding:16px 22px;border:2px solid}
.verdict.bad{border-color:var(--bad);background:var(--crit-soft)}
.verdict.good{border-color:var(--good);background:var(--stamp-soft)}
.verdict .vh{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.verdict .vh i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:16px}
.verdict.bad .vh i{background:var(--bad)} .verdict.good .vh i{background:var(--good)}
.verdict p{font-family:var(--serif);font-size:23px;line-height:1.4;margin:8px 0 6px}
.persp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:6px}
.persp .card{display:flex;flex-direction:column;gap:4px;padding:16px 22px}
.persp .who{font-size:16px;font-weight:700;color:var(--ink-3)}
.persp b{font-size:28px}
.persp .gq{font-size:21px;line-height:1.35}
.persp .ev{font-size:16px;color:var(--teal-ink);margin-top:4px}
.bplan{width:520px;flex:none;display:flex;flex-direction:column;gap:10px}
.bp{border:2px solid var(--rule);background:var(--panel);border-radius:12px;padding:12px 18px;display:flex;flex-direction:column;gap:2px;transition:background .3s,color .3s,border-color .3s}
.bp b{font-size:24px}
.bp > span{font-size:17px;opacity:.8}
.bp-2{min-height:250px}
.bp-sub{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bp-sub span{border:1.5px dashed currentColor;border-radius:8px;padding:8px 12px;font-size:17px;opacity:.85}
.slide.s1:not(.s2) .bp-1,.slide.s2:not(.s3) .bp-2,.slide.s3:not(.s4) .bp-3,.slide.s4:not(.s5) .bp-4{background:#135C7C;border-color:#135C7C;color:#fff}
.bpd{gap:12px}
.bpd h2{margin:0}
.bpd p{font-size:23px;line-height:1.4;margin:0}
.chain{display:flex;flex-wrap:wrap;gap:8px}
.ch{font-size:18px;font-weight:600;padding:6px 12px;border-radius:8px;background:var(--hlc)}
.c1{--hlc:rgba(27,115,154,.24)} .c2{--hlc:var(--hl-y)} .c3{--hlc:var(--hl-g)} .c4{--hlc:var(--hl-b)} .c5{--hlc:var(--hl-r)}
.mp{font-family:var(--serif);font-size:25px;line-height:1.62;margin:0}
.pt{background-image:linear-gradient(var(--hlc),var(--hlc));background-repeat:no-repeat;background-size:0% 82%;background-position:0 55%;transition:background-size .6s ease;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:.15em}
.pt-1{--hlc:rgba(27,115,154,.24)} .pt-2{--hlc:var(--hl-y)} .pt-3{--hlc:var(--hl-g)} .pt-4{--hlc:var(--hl-b)} .pt-5{--hlc:var(--hl-r)}
.slide.s1 .pt-1,.slide.s2 .pt-2,.slide.s3 .pt-3,.slide.s4 .pt-4,.slide.s5 .pt-5{background-size:100% 82%}
.chv{display:grid;grid-template-columns:40px 1fr;column-gap:12px;align-items:center;border:1px solid var(--rule);background:var(--panel);border-radius:12px;padding:8px 14px}
.chv i{grid-row:span 2;width:40px;height:40px;border-radius:8px;background:var(--hlc);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--ink)}
.chv b{font-size:21px;line-height:1.2}
.chv span{font-size:16px;color:var(--ink-2);line-height:1.25}
.plan td{font-size:18px;height:58px}
.plan td.k{width:190px}
.plan td[contenteditable]{outline:none;cursor:text}
.plan td[contenteditable]:focus{background:var(--teal-soft)}
.plan td.k[contenteditable]{color:var(--ink-3)}
.chk{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;font-size:19px;line-height:1.3;padding:6px 0;cursor:pointer;border-bottom:1px solid var(--rule-2)}
.chk i{width:26px;height:26px;border:2px solid var(--rule);border-radius:6px;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;margin-top:1px}
.chk.on i{background:var(--good);border-color:var(--good)}
.chk.on i::after{content:"✓"}
.model{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mrow{display:grid;grid-template-columns:190px 1fr;gap:20px;align-items:start;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.mlab{font-size:16px;font-weight:700;color:var(--teal-ink);padding-top:3px;line-height:1.25}
.mrow p{font-family:var(--serif);font-size:19px;line-height:1.45;margin:0}


/* ============ Ergänzungen für diese Reihe ============ */
:root{--serif:"Lesetext","Source Serif 4",Charter,Georgia,serif}
h1{font-size:42px}
.kicker{font-size:20px;font-weight:700;color:var(--teal-ink);margin:0 0 6px;letter-spacing:.02em}
.sozial{display:inline-flex;align-items:center;font-size:16px;font-weight:700;color:var(--ink-2);border:1.5px solid var(--rule);border-radius:999px;padding:2px 12px;background:var(--panel);white-space:nowrap}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}

/* Chrome: Doppelstunden und Phasen */
#phases .dsb{font-weight:700;border:1.5px solid var(--rule);border-radius:999px;padding:4px 12px;color:var(--ink-2)}
#phases .dsb.cur{background:var(--teal);border-color:var(--teal);color:#fff}
#phases .dsb.cur::after{display:none}
#phases .sep{width:1px;height:22px;background:var(--rule);margin:0 8px}

/* Fest umbrochene Textzeilen: identisch mit dem Arbeitsblatt */
.lines{font-family:"Lesetext",var(--serif);font-size:25px;line-height:1.56}
.ln{grid-template-columns:44px 31.8em}
.ln .tx{display:block;width:31.8em;text-align:justify;text-align-last:justify;white-space:nowrap}
.ln.last .tx{text-align-last:left}
.ln.ind .tx{text-indent:1.3em}
.sec-grid{grid-template-columns:904px 1fr;gap:32px}
.sec-grid .book{padding:16px 26px 14px 12px}
.sec-grid .book-head{margin-bottom:10px}
.sec-side{gap:12px}
.penlegend{gap:6px}
.pen.pchip,.pchip{font-size:15px;padding:3px 10px 3px 5px}
.pen.pchip .sw{width:22px;height:14px}
.penlegend .pen{width:28px;height:28px}
.penlegend .pen.clear{height:28px}
.outline li{grid-template-columns:86px 1fr;font-size:16px}

/* Fragen zum Abschnitt */
.qa-area{display:flex;flex-direction:column;gap:12px;min-height:0}
.qa{display:flex;flex-direction:column;gap:10px}
.qhead{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700}
.qtyp{padding:2px 10px;border-radius:6px;background:var(--qc);color:var(--qi)}
.qhead .afb{margin-left:0}
.qnr{margin-left:auto;color:var(--ink-3);font-weight:600}
.qt-I{--qc:var(--teal-soft);--qi:var(--teal-ink)}
.qt-F{--qc:var(--hl-y);--qi:var(--ink)}
.qt-II{--qc:var(--hl-b);--qi:var(--ink)}
.qt-III{--qc:var(--crit-soft);--qi:var(--crit)}
.qq{font-size:25px;line-height:1.3;font-weight:500;margin:0}
.qa .answer{font-size:21px;line-height:1.38}
.tip .lbl svg{width:16px;height:16px;vertical-align:-2px;margin-right:6px}

/* Start */
.start{display:grid;grid-template-columns:1fr 600px;gap:56px;align-items:center;height:100%;padding:0 10px}
.start .big{font-size:118px;line-height:.95;font-weight:800;letter-spacing:-.035em;margin:0}
.start .q{font-size:38px;line-height:1.15;font-weight:400;color:var(--ink-2);margin:16px 0 0}
.dscards{display:flex;flex-direction:column;gap:14px}
.dscard{display:grid;grid-template-columns:64px 1fr;gap:4px 18px;text-align:left;background:var(--panel);border:1.5px solid var(--rule);border-radius:14px;padding:16px 20px;cursor:pointer;align-items:center}
.dscard:hover{border-color:var(--teal)}
.dscard .nr{grid-row:span 3;width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:32px;font-weight:800}
.dscard b{font-size:27px;line-height:1.15}
.dscard span.s{font-size:18px;color:var(--ink-2);line-height:1.3}
.dscard span.w{font-size:17px;color:var(--teal-ink);font-weight:600}

/* Titel einer Doppelstunde */
.ttl{font-size:76px;line-height:1;font-weight:800;letter-spacing:-.025em;margin:0}
.title-grid .q{font-size:30px;margin:14px 0 26px}
.title-grid{grid-template-columns:1fr 440px}
.ablauf ol{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:21px;line-height:1.3}
.ablauf li{display:grid;grid-template-columns:34px 1fr;gap:10px}
.ablauf li i{font-style:normal;width:30px;height:30px;border-radius:50%;border:2px solid var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-weight:700;font-size:16px}

/* Arbeitsweise */
.steps4{display:flex;flex-direction:column;gap:12px}
.awc{display:grid;grid-template-columns:52px 1fr;gap:4px 16px;align-items:start;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 18px}
.awc i{grid-row:span 2;font-style:normal;width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}
.awc b{font-size:24px;line-height:1.2}
.awc span{font-size:19px;line-height:1.35;color:var(--ink-2)}
.stairs.small{height:440px;gap:10px}
.stairs.small .stair.l1{height:230px} .stairs.small .stair.l2{height:330px} .stairs.small .stair.l3{height:430px}
.stairs.small .stair{padding:14px 16px}
.stairs.small .stair h3{font-size:25px}
.stair .ds{font-size:17px;font-weight:700}
.stair.heute{box-shadow:0 0 0 4px #FAB219}
.stair .tx19{font-size:19px;line-height:1.36;margin:0}
.typrow{display:flex;gap:8px;flex-wrap:wrap;font-size:16px;font-weight:700;align-items:center}

/* Vor dem Lesen */
.vt{font-size:42px;line-height:1.08;font-weight:400;margin:6px 0 4px}
.vs{font-family:var(--serif);font-size:23px;line-height:1.3;color:var(--ink-2);margin:0}
.legend.col{flex-direction:column;gap:6px}

/* Zähler (Abstimmungen) */
.cnt{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--rule);background:var(--panel);border-radius:10px;padding:6px 12px;font-size:18px;font-weight:600;cursor:pointer;color:var(--ink)}
.cnt:hover{border-color:var(--teal)}
.cnt b{font-size:24px;font-weight:800;min-width:26px;text-align:right;font-variant-numeric:tabular-nums;color:var(--teal-ink)}
.cnt[disabled]{cursor:default;opacity:.9}
.cnt[disabled]:hover{border-color:var(--rule)}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vgrid .cnt{justify-content:space-between;padding:14px 18px;font-size:23px}
.vgrid .cnt b{font-size:34px}
.auslist{display:flex;flex-direction:column;gap:10px}
.aus{display:grid;grid-template-columns:1fr auto;gap:8px 20px;align-items:center;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:10px 18px}
.aus p{margin:0;font-size:23px;line-height:1.3}
.aus-b{display:flex;gap:8px}
.aus-sol{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:baseline;font-size:20px;line-height:1.36;border-top:1px solid var(--rule-2);padding-top:8px}
.badge{display:inline-block;font-size:16px;font-weight:700;padding:2px 12px;border-radius:999px;background:var(--teal);color:#fff;white-space:nowrap}

/* Tabellen zum Aufdecken */
table.cmp td{font-size:19px;line-height:1.34}
table.cmp td.k{font-weight:400}
table.cmp td.k b{font-weight:700}
table.cmp.fall td.k{width:auto}

/* Zeitleiste Fall */
.tl .y{font-size:18px;font-weight:700;padding-top:2px}
.timeline{gap:10px}
.tl{grid-template-columns:96px 1fr;font-size:22px}

/* Drei Versuche */
.versuch{display:grid;grid-template-columns:52px 1fr;gap:6px 16px;background:var(--panel);border:1.5px solid var(--rule);border-radius:12px;padding:12px 18px}
.versuch .bu{grid-row:span 2;width:48px;height:48px;border-radius:10px;background:var(--panel-2);display:grid;place-items:center;font-size:26px;font-weight:800}
.versuch p{font-family:var(--serif);font-size:21px;line-height:1.42;margin:0}
.versuch .urt{font-size:18px;line-height:1.35;display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start}
.versuch .urt i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.urt.nein i{background:var(--bad)} .urt.ja i{background:var(--good)}
.regel{display:grid;grid-template-columns:128px 1fr;gap:12px;font-size:20px;line-height:1.35;padding:8px 0;border-bottom:1px solid var(--rule-2)}
.regel b{color:var(--teal-ink)}

/* Aufgabe entschlüsseln: vierter Teil */
.taskbig p{font-size:35px;line-height:1.34}
.slide.s4 .tp4{border-color:var(--stamp)}
.tpn.n4{border-color:var(--stamp)}
.tp-notes.c4{grid-template-columns:1fr 1.15fr 1.15fr 1fr}
.tp-notes.c3{grid-template-columns:1fr 1.2fr 1.3fr}

/* Pyramide */
.pyrwrap{display:grid;grid-template-columns:70px 660px;gap:8px;align-items:stretch}
.pyr{width:660px;height:548px;display:flex;flex-direction:column;gap:3px;clip-path:polygon(37% 0,63% 0,100% 100%,0 100%)}
.pl{flex:1;border:0;background:var(--teal);color:#fff;font:inherit;font-size:21px;font-weight:600;cursor:pointer;padding:0;transition:background .3s}
.pl:hover{background:var(--teal-ink)}
.pl.sel{background:var(--ink)}
.slide.s1 .pl.miss{background:var(--sig)}
.slide.s1 .pl.miss.sel{background:var(--ink)}
.rangpfeil{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink-2);font-size:16px;font-weight:700}
.rangpfeil .line{flex:1;width:4px;background:var(--ink-2);border-radius:2px;position:relative;margin-bottom:10px}
.rangpfeil .line::after{content:"";position:absolute;left:-8px;bottom:-12px;border:10px solid transparent;border-top:14px solid var(--ink-2);border-bottom:0}
.rangpfeil span{writing-mode:vertical-rl;transform:rotate(180deg)}

/* Stufen der Beteiligung */
.stufen{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end;height:500px}
.stufe{border-radius:14px 14px 0 0;border:1px solid var(--rule);border-bottom:4px solid var(--ink);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.stufe.n1{height:250px;background:var(--panel-2)}
.stufe.n2{height:330px;background:var(--panel-2)}
.stufe.n3{height:410px;background:var(--teal-soft)}
.stufe.n4{height:490px;background:#135C7C;color:#fff;border-color:#135C7C;border-bottom-color:var(--ink)}
.stufe h3{font-size:24px;margin:0;line-height:1.15}
.stufe .ber{font-size:17px;font-weight:700;opacity:.85}
.stufe p{font-size:19px;line-height:1.34;margin:0}
.stufe .z{font-size:16px;opacity:.8;margin-top:auto}
.stufe .lab{font-size:15px;font-weight:700;opacity:.7}

/* Argumentkarten */
.arggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.argc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:2px solid var(--rule);border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;color:inherit;min-height:122px}
.argc:hover{border-color:var(--teal)}
.argc .at{font-size:18.5px;line-height:1.32}
.argc .am{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;margin-top:auto;visibility:hidden}
.argc.open .am{visibility:visible}
.argc .side{font-weight:800;padding:1px 9px;border-radius:6px;color:#fff}
.argc[data-side="pro"] .side{background:var(--good-ink)}
.argc[data-side="con"] .side{background:var(--crit)}
.argc.open[data-side="pro"]{border-color:var(--good)}
.argc.open[data-side="con"]{border-color:var(--crit)}
.argc .krit{border:1.5px solid currentColor;border-radius:6px;padding:0 7px;font-weight:700;color:var(--ink-2)}
.argc .bel{color:var(--ink-2)}

/* Pro und Kontra, Abschluss */
.these{font-family:var(--serif);font-size:30px;line-height:1.3;border-left:6px solid var(--teal);padding:6px 0 6px 20px;margin:4px 0}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pc .card{padding:14px 20px}
.pc h3{font-size:20px}
.pc ul{margin:6px 0 0;padding-left:22px;font-size:20px;line-height:1.36;display:flex;flex-direction:column;gap:6px}
.model.gross .mrow p{font-size:var(--mf,18.5px);line-height:1.42}
.model.gross .mrow{grid-template-columns:200px 1fr}
.bplan{width:470px}
.bp-2{min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .term{font-size:19px;border:1.5px solid var(--rule);border-radius:999px;padding:3px 14px;background:var(--panel);border-bottom-style:solid;cursor:pointer}
.chips .term:hover{border-color:var(--teal)}
.quell{display:grid;grid-template-columns:330px 1fr;gap:10px 24px;font-size:20px;line-height:1.4}
.quell b{color:var(--teal-ink)}
@media (prefers-reduced-motion: reduce){.slide.active{animation:none}.slide [data-step],.slide [data-step].vis,mark.hl,.pt,.tp,.pl{transition:none !important}}
#overview .dsh{grid-column:1/-1;font-size:18px;font-weight:700;color:var(--ink-2);margin:10px 0 0;border-bottom:1px solid var(--rule);padding-bottom:4px}

/* ============ Passwortabfrage ============ */
#gate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--paper);padding:16px;font-family:var(--sans);color:var(--ink)}
#gate form{width:min(560px,100%);background:var(--panel);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--sheet-shadow);padding:32px 36px}
#gate h1{font-size:34px;margin:0 0 6px}
#gate p{font-size:19px;color:var(--ink-2);margin:0 0 18px}
#gate .gr{display:flex;gap:10px}
#gate input{flex:1;min-width:0;font:inherit;font-size:22px;padding:10px 14px;border:1.5px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
#gate input:focus{outline:none;border-color:var(--teal)}
#gate button{font:inherit;font-size:20px;font-weight:600;padding:10px 20px;border-radius:10px;border:0;background:var(--teal);color:#fff;cursor:pointer}
#gmsg{min-height:1.4em;margin:12px 0 0 !important;color:var(--crit) !important}
</style>
</head>
<body>
<div id="gate"><form id="gf"><h1>Recht im Betrieb</h1><p>Politik-Wirtschaft. Bitte das Passwort eingeben.</p>
<div class="gr"><input id="gpw" type="password" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Passwort"><button>Öffnen</button></div>
<p id="gmsg"></p></form></div>
<div id="app"></div>

const KEY='rib-pw';
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const b64d=s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0))};
const get=()=>{try{return localStorage.getItem(KEY)||''}catch(e){return ''}},set=v=>{try{localStorage.setItem(KEY,v)}catch(e){}};
async function unlock(pw){try{
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(norm(pw)),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(LOCK.s),iterations:LOCK.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const p=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(LOCK.i)},k,b64d(LOCK.c))));
  document.getElementById('gate').remove();
  document.getElementById('app').innerHTML=p.markup;
  const s=document.createElement('script');s.textContent=p.code;document.body.appendChild(s);return true}catch(e){return false}}
(async function(){
  const m=/^#pw=([^&]+)/.exec(location.hash);
  if(m){let v=m[1];try{v=decodeURIComponent(v)}catch(e){}try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(await unlock(v)){set(v);return}}
  const saved=get();if(saved&&await unlock(saved))return;
  const g=document.getElementById('gate'),i=document.getElementById('gpw');g.style.display='flex';i.focus();
  document.getElementById('gf').onsubmit=async e=>{e.preventDefault();if(await unlock(i.value))set(i.value);else{document.getElementById('gmsg').textContent=window.crypto&&crypto.subtle?'Das Passwort stimmt nicht. Bitte noch einmal versuchen.':'Dieser Browser kann die Seite nicht öffnen. Bitte über https aufrufen.';i.select()}};
})();
})();
